name = "philip"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# Secrets (set locally in .dev.vars, in prod via `wrangler pages secret put`):
#   OPENROUTER_API_KEY   required
#   OPENROUTER_MODEL     optional (defaults to anthropic/claude-sonnet-4)

[[d1_databases]]
binding = "DB"
database_name = "philip-db"
database_id = "3bb5a0d6-7136-4c54-a3a0-aa74c4f23df0"

# Preview deployments (every non-main branch / PR) use an isolated database so PR
# testing never touches production conversation data. Only D1 is configured at the
# top level, so only D1 needs to be redeclared here (non-inheritable keys rule).
[[env.preview.d1_databases]]
binding = "DB"
database_name = "philip-db-preview"
database_id = "4798ef3e-54f5-43f1-93cb-d89a13a55daa"
