name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight deploy per branch; newer pushes cancel superseded runs.
concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# The critical path to production: typecheck + unit tests, then ship. The
# slower browser (e2e) and live integration checks run in parallel in ci.yml
# and never block a deploy — they surface failures as their own status checks.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # main -> production deployment; any other branch (i.e. a PR) -> a Cloudflare
      # Pages *preview* deployment at https://<branch>.philip-3jf.pages.dev.
      # Skipped for PRs from forks, which cannot access repository secrets.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "944c6380fdc8979e3d6b720bab351928"
          # Project name and output dir come from wrangler.toml. The branch decides
          # production (main) vs preview (everything else).
          command: pages deploy public --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const marker = '<!-- cf-pages-preview -->';
            const body = `${marker}\n🚀 **Preview deployed:** ${url}\n\n_Updated for commit ${context.sha.slice(0, 7)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
