<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philip — read the Bible together</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Philip</h1>
      <a href="#" id="new-chat" title="Start a fresh conversation">new</a>
      <p class="tagline">“Do you understand what you are reading?” — Acts 8:30</p>
    </header>

    <main id="log" class="log" aria-live="polite">
      <div class="msg msg-assistant">
        <div class="msg-body">
          <p>Hi — I’m Philip.</p>
          <p>
            Let’s read the Bible together, a few verses at a time. Tell me where
            to start, bring a question that’s been on your mind, or just say
            <em>start</em> and I’ll pick a place.
          </p>
        </div>
      </div>
    </main>

    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Type a verse, a question, or “start”…"
        autocomplete="off"
      ></textarea>
      <button id="mic" type="button" aria-label="Record voice" title="Record voice">&#127908;</button>
      <button id="send" type="submit">Send</button>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
