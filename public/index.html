<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philip — read the Bible together</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Philip</h1>
      <a href="#" id="new-chat" title="Start a fresh conversation">new</a>
      <p class="tagline">“Do you understand what you are reading?” — Acts 8:30</p>
    </header>

    <main id="log" class="log" aria-live="polite">
      <div class="msg msg-assistant">
        <div class="msg-body">
          <p>Hi — I’m Philip.</p>
          <p>
            Let’s read the Bible together, a few verses at a time. Tell me where
            to start, bring a question that’s been on your mind, or just say
            <em>start</em> and I’ll pick a place.
          </p>
        </div>
      </div>
    </main>

    <form id=”composer” class=”composer”>
      <textarea
        id=”input”
        rows=”1”
        placeholder=”Type a verse, a question, or “start”…”
        autocomplete=”off”
      ></textarea>
      <button id=”mic” type=”button” aria-label=”Record voice” title=”Record voice”>
        <svg xmlns=”http://www.w3.org/2000/svg” width=”16” height=”16” viewBox=”0 0 24 24” fill=”none” stroke=”currentColor” stroke-width=”2.2” stroke-linecap=”round” stroke-linejoin=”round” aria-hidden=”true”>
          <path d=”M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z”/>
          <path d=”M19 10v2a7 7 0 0 1-14 0v-2”/>
          <line x1=”12” y1=”19” x2=”12” y2=”23”/>
          <line x1=”8” y1=”23” x2=”16” y2=”23”/>
        </svg>
      </button>
      <button id=”send” type=”submit”>Send</button>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
