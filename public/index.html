<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philip — read the Bible together</title>
    <!-- Resolve and apply the theme before first paint so there's no flash of
         the wrong colors. Order of preference: the reader's saved choice, then
         the OS preference if one is expressed, then the time of day (light
         06:00–18:00, dark otherwise). app.js wires the toggle from here. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("philip:theme");
          var theme;
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia &&
            (matchMedia("(prefers-color-scheme: dark)").matches ||
              matchMedia("(prefers-color-scheme: light)").matches)
          ) {
            theme = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            var h = new Date().getHours();
            theme = h >= 6 && h < 18 ? "light" : "dark";
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Per-translation quote typefaces (graceful fallback to the body serif). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Cormorant+Garamond:ital@0;1&family=UnifrakturMaguntia&family=EB+Garamond:ital@0;1&family=Gentium+Book+Plus&family=David+Libre&family=Cardo:ital@0;1&display=swap"
    />
  </head>
  <body>
    <!-- The entire UI (header, log, composer, about overlay) is rendered by the
         Preact app in ./app.js. The inline theme script above still runs first
         so there's no flash of the wrong colors before the app mounts. -->
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
