<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philip — read the Bible together</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Per-translation quote typefaces (graceful fallback to the body serif). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Cormorant+Garamond:ital@0;1&family=UnifrakturMaguntia&family=EB+Garamond:ital@0;1&family=Gentium+Book+Plus&family=David+Libre&family=Cardo:ital@0;1&display=swap"
    />
  </head>
  <body>
    <header class="topbar">
      <h1>Philip</h1>
      <a href="#" id="toggle-conversations" class="chip" aria-expanded="false" aria-controls="conversations" title="Saved conversations" hidden>saved</a>
      <a href="#" id="share-chat" class="chip disabled" aria-disabled="true" title="Copy a link to this conversation">share</a>
      <a href="#" id="new-chat" class="chip" title="Start a fresh conversation">new</a>
      <p class="tagline">“Do you understand what you are reading?” — Acts 8:30</p>

      <!-- Past conversations saved in this browser. Opened from the "saved"
           chip; the chip itself only appears once there's something in the list,
           so the first-visit start page stays thin. -->
      <nav id="conversations" class="conversations" aria-label="Saved conversations" hidden>
        <h2 id="conversations-title" class="conversations-title">Saved conversations</h2>
        <ul id="conversation-list" class="conversation-list"></ul>
      </nav>
    </header>

    <main id="log" class="log" aria-live="polite">
      <div class="msg msg-assistant">
        <div class="msg-body">
          <p>Hi — I’m Philip.</p>
          <p>
            Let’s read the Bible together, a few verses at a time. Tell me where
            to start, bring a question that’s been on your mind, or just say
            <em>start</em> and I’ll pick a place.
          </p>
        </div>
      </div>
    </main>

    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Type a verse, a question, or “start”…"
        autocomplete="off"
      ></textarea>
      <div class="composer-actions">
        <button id="send" type="submit">Send</button>
      </div>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
