<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philip — read the Bible together</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Per-translation quote typefaces (graceful fallback to the body serif). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Cormorant+Garamond:ital@0;1&family=UnifrakturMaguntia&family=EB+Garamond:ital@0;1&family=Gentium+Book+Plus&family=David+Libre&family=Cardo:ital@0;1&display=swap"
    />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Philip</h1>
      <a href="#" id="new-chat" title="Start a fresh conversation">new</a>
      <p class="tagline">“Do you understand what you are reading?” — Acts 8:30</p>
    </header>

    <main id="log" class="log" aria-live="polite">
      <div class="msg msg-assistant">
        <div class="msg-body">
          <p>Hi — I’m Philip.</p>
          <p>
            Let’s read the Bible together, a few verses at a time. Tell me where
            to start, bring a question that’s been on your mind, or just say
            <em>start</em> and I’ll pick a place.
          </p>
        </div>
      </div>
    </main>

    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Type a verse, a question, or “start”…"
        autocomplete="off"
      ></textarea>
      <button id="mic" type="button" aria-label="Record voice" title="Record voice">&#127908;</button>
      <div id="turnstile-widget" class="cf-turnstile"
           data-sitekey="0x4AAAAAADe9n8-uSsPgG9eP"
           data-callback="onTurnstileToken"
           data-error-callback="onTurnstileError"
           data-size="flexible"></div>
      <button id="send" type="submit">Send</button>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
